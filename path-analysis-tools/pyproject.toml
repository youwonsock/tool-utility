[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "path-analysis-tools"
version = "1.0.0"
description = "Host-neutral reference image path calculation and scene edit planning"
requires-python = ">=3.12"
dependencies = ["Pillow>=12,<13", "jsonschema>=4.26,<5", "mcp>=1.30,<2"]

[project.scripts]
path-analysis-tools = "path_analysis_tools.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
path_analysis_tools = ["schemas/*.json"]
