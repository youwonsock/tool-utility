name: Codex OpenCode tests
on:
  push:
    paths: ["codex-opencode/**", ".github/workflows/codex-opencode.yml"]
  pull_request:
    paths: ["codex-opencode/**", ".github/workflows/codex-opencode.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: codex-opencode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: codex-opencode/package-lock.json
      - run: npm ci
      - run: npm run check
