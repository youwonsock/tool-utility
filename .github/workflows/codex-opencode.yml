name: Codex OpenCode
on:
  push:
    branches: [main, codex/opencode-delegation]
    paths: [codex-opencode/**, .github/workflows/codex-opencode.yml]
  pull_request:
    paths: [codex-opencode/**, .github/workflows/codex-opencode.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: codex-opencode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: codex-opencode/package-lock.json
      - run: npm ci
      - run: npm run check
