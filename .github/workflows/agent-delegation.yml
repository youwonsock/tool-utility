name: Agent delegation tests
on:
  push:
    paths: ["agent-delegation/**", ".github/workflows/agent-delegation.yml"]
  pull_request:
    paths: ["agent-delegation/**", ".github/workflows/agent-delegation.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: agent-delegation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: agent-delegation/package-lock.json
      - run: npm ci
      - run: npm run check
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: agent-delegation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: agent-delegation/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Prepare separate test SDKs and CLIs without changing global installations
        run: node scripts/prepare-connections.mjs "${{ runner.temp }}/agent-delegation-connections"
      - name: Native initialization and connection checks without model tasks
        run: npm run check:connections -- "${{ runner.temp }}/agent-delegation-connections"
