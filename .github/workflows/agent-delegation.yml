name: Agent delegation tests
on:
  push:
    paths: ["agent-delegation/**", ".github/workflows/agent-delegation.yml"]
  pull_request:
    paths: ["agent-delegation/**", ".github/workflows/agent-delegation.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: agent-delegation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: agent-delegation/package-lock.json
      - run: npm ci
      - name: Regression checks with bounded sanitized diagnostics
        env:
          AGENT_DELEGATION_TEST_ROOT: ${{ runner.temp }}/agent-delegation-owned-fixtures
        run: node scripts/ci-check.mjs regression "${{ runner.temp }}/agent-delegation-diagnostics"
      - name: Upload sanitized regression failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: agent-regression-${{ matrix.os }}
          path: ${{ runner.temp }}/agent-delegation-diagnostics/
          if-no-files-found: ignore
          retention-days: 7
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: agent-delegation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: agent-delegation/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Prepare separate test SDKs and CLIs without changing global installations
        run: node scripts/ci-check.mjs prepare "${{ runner.temp }}/agent-delegation-diagnostics" "${{ runner.temp }}/agent-delegation-connections"
      - name: Native initialization and connection checks without model tasks
        run: node scripts/ci-check.mjs native "${{ runner.temp }}/agent-delegation-diagnostics" "${{ runner.temp }}/agent-delegation-connections"
      - name: Upload sanitized native failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: agent-native-${{ matrix.os }}
          path: ${{ runner.temp }}/agent-delegation-diagnostics/
          if-no-files-found: ignore
          retention-days: 7
