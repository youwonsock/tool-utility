name: Video tools distribution
on:
  push:
    branches: ["**"]
    paths: ["video-tools/**", ".github/workflows/video-tools.yml"]
    # Release tags package both runtimes; path filters do not apply to tags.
    tags: ["video-tools-v*"]
  pull_request:
    paths: ["video-tools/**", ".github/workflows/video-tools.yml"]
  workflow_dispatch:
    inputs:
      refresh:
        description: "Regenerate both runtime archives for tools/sync_runtime.py"
        type: boolean
        default: false
      ffmpeg:
        description: "Build both minimal FFmpeg archives from tools/ffmpeg-sources.json"
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  ffmpeg:
    if: ${{ inputs.ffmpeg }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        working-directory: video-tools
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install MSYS2 MINGW64 build tools
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make diffutils nasm
            mingw-w64-x86_64-gcc mingw-w64-x86_64-binutils mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-meson mingw-w64-x86_64-ninja
      - name: Install Mac build tools
        if: runner.os == 'macOS'
        run: brew install nasm meson ninja pkg-config
      - name: Build minimal static FFmpeg
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: python tools/build_ffmpeg.py
      - name: Decode, extract and re-encode every supported codec with the new FFmpeg
        # Samples are encoded with the committed full FFmpeg, so this check needs
        # a runtime that predates the minimal build (or another full FFmpeg).
        shell: bash
        run: |
          set -e
          work="$RUNNER_TEMP/ffmpeg-check"
          mkdir -p "$work/new"
          tar -xzf .build/artifacts/ffmpeg-*.tar.gz -C "$work/new"
          if [ "$RUNNER_OS" = "Windows" ]; then
            py=portable/windows-x64/python/python.exe; old=portable/windows-x64/media/ffmpeg.exe; new="$work/new/ffmpeg.exe"
          else
            py=portable/macos-arm64/python/bin/python3.14; old=portable/macos-arm64/media/ffmpeg; new="$work/new/ffmpeg"
          fi
          "$py" -I -B -X utf8 tools/make_codec_samples.py "$old" "$work/samples"
          "$py" -I -B -X utf8 tools/verify_smoke.py --codec-matrix "$work/samples" --matrix-ffmpeg "$new" --report "$work/report.json"
      - name: Preserve codec check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-ffmpeg-check-${{ matrix.os }}
          path: ${{ runner.temp }}/ffmpeg-check/report.json
          if-no-files-found: warn
      - name: Preserve FFmpeg archive and its corresponding sources
        uses: actions/upload-artifact@v4
        with:
          name: video-ffmpeg-${{ matrix.os }}
          path: |
            video-tools/.build/artifacts/ffmpeg-*.tar.gz
            video-tools/.build/artifacts/ffmpeg-*.tar.gz.sha256
            video-tools/.build/artifacts/ffmpeg-sources/
          if-no-files-found: error
  runtime:
    if: ${{ !inputs.ffmpeg }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: video-tools
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Prepare native runtime distribution
        env:
          REFRESH: ${{ inputs.refresh || 'false' }}
        run: |
          python -c "import os,subprocess,sys; args=[sys.executable,'tools/build_runtime.py','--archive']; args+=['--refresh'] if os.environ['REFRESH']=='true' else []; subprocess.run(args,check=True)"
      - name: Audit committed distribution files
        if: ${{ !inputs.refresh }}
        run: python tools/build_runtime.py --audit --git
      - name: Exercise bundled runtime and stdio MCP media operations
        timeout-minutes: 5
        run: |
          python -c "import os,pathlib,subprocess,sys; runtime='portable/windows-x64/python/python.exe' if sys.platform=='win32' else 'portable/macos-arm64/python/bin/python3.14'; report=pathlib.Path(os.environ['RUNNER_TEMP'])/'video-tools-smoke'/'report.json'; subprocess.run([runtime,'-I','-B','-X','utf8','tools/verify_smoke.py','--report',str(report)],check=True)"
      - name: Package standalone platform ZIP
        if: ${{ !inputs.refresh }}
        run: python tools/package_release.py
      - name: Preserve media regression diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-smoke-${{ matrix.os }}
          path: ${{ runner.temp }}/video-tools-smoke/report.json
          if-no-files-found: warn
      - name: Preserve runtime artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-runtime-${{ matrix.os }}
          path: |
            video-tools/.build/artifacts/windows-x64.tar.gz*
            video-tools/.build/artifacts/macos-arm64.tar.gz*
          if-no-files-found: error
      - name: Preserve platform ZIP
        if: ${{ !inputs.refresh }}
        uses: actions/upload-artifact@v4
        with:
          name: video-release-${{ matrix.os }}
          path: |
            video-tools/.build/artifacts/video-tools-*.zip
            video-tools/.build/artifacts/video-tools-*.zip.sha256
          if-no-files-found: error
  release:
    if: ${{ startsWith(github.ref, 'refs/tags/video-tools-v') }}
    needs: runtime
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: video-release-*
          merge-multiple: true
          path: release
      - name: Publish the platform ZIPs on the tag's release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" \
            --title "Video Tools ${GITHUB_REF_NAME#video-tools-}" \
            --notes "Windows x64: video-tools-windows-x64.zip · Mac Apple Silicon: video-tools-macos-arm64.zip. Extract the whole ZIP and run run.bat or run_mac.command."
