name: Video tools distribution
on:
  push:
    paths: ["video-tools/**", ".github/workflows/video-tools.yml"]
  pull_request:
    paths: ["video-tools/**", ".github/workflows/video-tools.yml"]
  workflow_dispatch:
    inputs:
      refresh:
        description: "Regenerate both runtime archives for tools/sync_runtime.py"
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: video-tools
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Prepare native runtime distribution
        env:
          REFRESH: ${{ inputs.refresh || 'false' }}
        run: |
          python -c "import os,subprocess,sys; args=[sys.executable,'tools/build_runtime.py','--archive']; args+=['--refresh'] if os.environ['REFRESH']=='true' else []; subprocess.run(args,check=True)"
      - name: Audit committed distribution files
        if: ${{ !inputs.refresh }}
        run: python tools/build_runtime.py --audit --git
      - name: Preserve runtime artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-runtime-${{ matrix.os }}
          path: |
            video-tools/.build/artifacts/*.tar.gz
            video-tools/.build/artifacts/*.sha256
          if-no-files-found: error
